<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעצב חכם</title>
<meta name="theme-color" content="#2f2a26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מעצב חכם">
<style>
:root{
  --bg:#f6f2ec; --card:#fff; --ink:#2f2a26; --muted:#7a7068; --line:#e6ddd2;
  --accent:#a86b4a; --accent2:#c9a27e; --red:#c0392b; --orange:#d68910; --green:#2e8b57;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Heebo,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
main{padding:14px 14px calc(90px + var(--safe-b));max-width:900px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--muted)}
nav.tabs button b{display:block;font-size:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.list-item .ic{font-size:28px;width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.list-item .ic img{width:100%;height:100%;object-fit:cover}
.muted{color:var(--muted);font-size:13px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 10px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
button.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c4}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
button.btn.full{width:100%}
button:disabled{opacity:.5}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;background:#ece5dc;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee;cursor:pointer}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t .x{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:26px;height:26px;font-size:14px}
.catbar{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -4px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.catbar .cb{scroll-snap-align:start;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:14px}
.catbar .cb i{font-style:normal;font-size:18px}.catbar .cb b{font-size:12px;background:#f1e7dc;color:var(--accent);border-radius:10px;padding:1px 7px}
.catbar .cb.on{background:var(--accent);color:#fff;border-color:var(--accent)}.catbar .cb.on b{background:rgba(255,255,255,.25);color:#fff}
.catbar .cb.empty{opacity:.6}.catbar .cb.rev{border-color:var(--orange);color:var(--orange);font-weight:700}.catbar .cb.rev.on{background:var(--orange);color:#fff}
.catbar .cb.add{border-style:dashed;font-weight:700}
.swatches .sw.picked .c{outline:4px solid var(--accent);outline-offset:2px}
.swatches .sw.picked::after{content:'✓';position:absolute;top:2px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
#selBar{position:fixed;left:10px;right:10px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;gap:8px;background:#2d2620;color:#fff;padding:10px 12px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#selBar b{flex:1}
#selBar .sbr{display:flex;gap:8px;align-items:center}#selBar .sbr .btn{flex:1}#selBar .btn:disabled{opacity:.45}
.picks{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.picks .pk{position:relative;flex:none;width:78px;text-align:center;font-size:11px;cursor:pointer}
.picks .pk img{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#f4f1ec;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.15)}.picks .pk span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.picks .pk button{position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:0}
#fbook{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at center,#4a3b30 0%,#211a15 100%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.fb-top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;color:#f3e9dd;font-weight:700}
.fb-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.fb-stage{flex:1;position:relative;perspective:1600px;margin:0 14px;min-height:0}
.fb-page{position:absolute;inset:0;background:#fbf8f3;border-radius:6px 16px 16px 6px;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 14px 0 18px -14px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;backface-visibility:hidden}
.fb-page.under{z-index:0}.fb-page:not(.under){z-index:1}
.fb-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35));pointer-events:none;opacity:0}
.fb-stage{touch-action:pan-y}
.fb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#f4f1ec}
.fb-img img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none}
.fb-info{padding:12px 16px 16px;border-top:1px solid #eadfd2}.fb-info h3{margin:2px 0 8px;font-size:19px}.fb-cat{font-size:12px;color:var(--accent);font-weight:700}
.fb-info p{margin:8px 0 0;font-size:14px;color:#5b4d42}.fb-chip{display:inline-block;background:#f1e7dc;border-radius:10px;padding:2px 8px;margin:0 0 4px 4px;font-size:12px}
.fb-bot{position:relative;z-index:5;display:flex;gap:8px;padding:12px 14px}.fb-bot .btn{flex:1}.fb-bot .btn:disabled{opacity:.35}
#zoomv{position:fixed;inset:0;z-index:300;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#zoomv img{max-width:100%;max-height:100%;transition:transform .05s;touch-action:none}
.subbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.swatches .sw{text-align:center;cursor:pointer;min-width:0}
.swatches .sw .c{aspect-ratio:1;border-radius:50%;overflow:hidden;background:#eee;border:3px solid #fff;box-shadow:0 2px 8px rgba(60,40,20,.18);transition:transform .15s}
.swatches .sw:active .c{transform:scale(.95)}
.swatches .sw img{width:100%;height:100%;object-fit:cover;display:block}
.swatches .sw img.fit{object-fit:contain;background:#fff;padding:10%;box-sizing:border-box}
.swatches .sw{position:relative}
.swatches .sw .flag{position:absolute;top:2px;left:6px;background:var(--orange);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.swatches .sw .spin3d{position:absolute;top:2px;right:6px;background:#fff;border-radius:50%;width:24px;height:24px;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.angstrip{display:flex;gap:6px;overflow-x:auto;justify-content:center;margin-top:6px}.angstrip .ang{position:relative;flex:none;width:54px;height:54px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#fff}
.angstrip .ang.on{border-color:var(--accent)}.angstrip .ang img{width:100%;height:100%;object-fit:contain}.angstrip .ang button{position:absolute;top:0;left:0;width:20px;height:20px;border:0;border-radius:0 0 8px 0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:0}
.swatches .sw .n{font-size:12px;margin-top:6px;line-height:1.3;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.swatches .sw .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdots{display:flex;gap:6px;justify-content:center;margin:5px 0 2px;flex-wrap:wrap}.cdot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #0003;cursor:pointer;flex:none}.cdot.on{box-shadow:0 0 0 2px var(--accent)}.fb-info .cdots{justify-content:flex-start;margin:6px 0}.fb-info .cdot{width:24px;height:24px}
.thumbs .t.sel{outline:3px solid var(--accent)}
.rule{display:flex;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px;line-height:1.4}
.rule.red{background:#fdecea}.rule.orange{background:#fff4e0}.rule.green{background:#e8f5ee}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot.red{background:var(--red)}.dot.orange{background:var(--orange)}.dot.green{background:var(--green)}
.check-row{border-bottom:1px solid var(--line);padding:10px 0}
.check-row:last-child{border:0}
.check-row .res{font-size:13px;margin-top:6px}
.ba{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;user-select:none;touch-action:none}
.ba img{display:block;width:100%}
.ba .after{position:absolute;inset:0;overflow:hidden}
.ba .after img{position:absolute;top:0;right:0;width:100%;height:100%;object-fit:cover}
.ba .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.ba .handle:after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px}
.ba .lbl{position:absolute;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:700px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--safe-b))}
.modal .sheet .top{display:flex;align-items:center;margin-bottom:10px}
.modal .sheet .top h3{flex:1;margin:0;font-size:18px}
.modal .sheet .top button{background:none;border:0;font-size:24px}
.toast{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:400;font-size:14px;max-width:90%;text-align:center}
.spinner{width:40px;height:40px;border:4px solid #e6ddd2;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.cat-item{display:flex;gap:10px;align-items:center}
.cat-item img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eee}
.pick{border:2px solid transparent}
.pick.on{border-color:var(--accent);background:#fbf3ec}
.badge{display:inline-block;font-size:11px;background:#ece5dc;border-radius:8px;padding:2px 7px;margin-inline-start:4px}
.note-ic{font-size:13px;color:var(--accent);cursor:pointer}
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
#splash video{width:100%;height:100%;object-fit:cover}
#splash .sbtn{position:absolute;bottom:calc(24px + var(--safe-b));background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:22px;padding:10px 18px;font-size:15px}
#splash .skip{left:16px}#splash .snd{right:16px}
#updBar{position:fixed;top:calc(56px + var(--safe-t));left:10px;right:10px;z-index:40;background:#2e8b57;color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#updBar button{background:#fff;color:#2e8b57;border:0;border-radius:9px;padding:7px 12px;font-weight:700}
header .logo{width:30px;height:30px;border-radius:50%}
#print{display:none}
@media print{
  header,nav.tabs,main,.modal,.toast{display:none!important}
  #print{display:block}
  body{background:#fff}
  .pp{page-break-after:always;padding:10px}
  .pp img{max-width:100%;max-height:420px;display:block;margin:6px 0}
  .pp table{width:100%;border-collapse:collapse;font-size:13px}
  .pp td,.pp th{border:1px solid #ccc;padding:5px;text-align:right}
  #print td{border-bottom:1px solid #e3ddd5;padding:5px;text-align:right;vertical-align:top}
}
</style>
</head>
<body>
<header>
  <button id="backBtn" aria-label="חזרה" style="display:none">→</button>
  <img class="logo" src="media/logo.png" alt=""><h1 id="title">מעצב חכם</h1>
  <button id="helpBtn" aria-label="עזרה">?</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="projects" class="on"><b>📁</b>פרויקטים</button>
  <button data-tab="catalog"><b>🧱</b>קטלוג</button>
  <button data-tab="rules"><b>📏</b>כללים</button>
  <button data-tab="settings"><b>⚙️</b>הגדרות</button>
</nav>
<div id="print"></div>
<script src="rules.js?v=1.1.4"></script>
<script src="app.js?v=1.1.4"></script>
<script src="plan.js?v=1.1.4"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
